name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      GEMINI_API_KEY: test-key-ci
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: redis://localhost:6379
      JWT_SECRET_KEY: ci-secret-key
      ADMIN_KEY: test-admin-key  # must match X-Admin-Key used in tests/conftest.py
      VECTOR_BACKEND: faiss

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt aiosqlite ruff mypy

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/

      # Advisory: surfaces pre-existing type errors (incl. the unimplemented
      # admin embedding endpoints) without failing the build. Tighten as debt is paid down.
      - name: Type check (mypy)
        working-directory: backend
        continue-on-error: true
        run: mypy app/ --ignore-missing-imports

      - name: Tests (pytest)
        working-directory: backend
        run: pytest tests/ -q --tb=short

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
