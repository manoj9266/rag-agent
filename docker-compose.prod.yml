# Production stack for GCP VM deployment.
#
# Postgres is managed externally by Neon — set DATABASE_URL in .env.prod.
# Redis runs as a container (internal network only).
# app is published on 127.0.0.1:8000 — host nginx reverse-proxies to it.
#
# Deploy:  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

name: rag-agent

services:
  app:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-prod.txt   # slim image; Gemini embeddings only
    env_file: .env.prod
    environment:
      PORT: "8010"
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./data:/data                           # FAISS indexes + uploaded docs (persistent)
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  redisdata:
